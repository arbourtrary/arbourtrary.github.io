<svg width="680" height="1270" viewBox="0 0 680 1270" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:'anthropic-sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Recipe document pipeline with five labelled phases and idempotency ledger</title>
<desc>Vertical pipeline divided into five phases marked in the left margin: discover, extract and load, transform, ML transform, and product feature. The first three sit inside a dashed at-least-once delivery zone where each worker reads and writes a Postgres ledger. The last two are Airflow-orchestrated and write to BigQuery gold before publishing to OpenSearch for the agent.</desc>

